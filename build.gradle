plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.75'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 可选：如果需要 mapping 和 access transformer
minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

dependencies {
    // NeoForge 依赖由 moddev 插件自动提供，无需手动添加
}
